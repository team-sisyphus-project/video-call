# Local preview contract for meetspace.
#
# The backend (server/index.js) serves the built frontend from `build/` and the
# static assets deployed next to it, so a single process on a single port is the
# whole app. The port is never written down here: the server reads it from the
# PORT environment variable that the preview platform injects.
#
# Both commands go through `scripts/preview.js`, which runs the preview as named
# stages — install, build, start — and, when one of them fails, prints a single
# line naming it:
#
#     [preview] STAGE=build STATUS=failed
#
# followed by the exit status and the tail of that stage's own output. Grep the
# preview log for `[preview] STAGE=` to find out which stage stopped the run;
# there is exactly one such line per failed run. The stages run `npm install`,
# `npm run build:preview` and `npm start`, and their output is streamed through
# as it happens.
#
# The two stages before `npm start` do less than a release build, because this
# runner is given fewer minutes and less memory than one:
#
#   - install runs with MEETSPACE_SKIP_MOBILE=1, so postinstall applies the
#     patches/ overrides and skips the three React Native steps (jetify,
#     android-clean-cmake-cache, android-autolinking). A web preview never
#     builds the mobile side.
#   - build runs `npm run build:preview` (`make preview`), not `npm run build`.
#     That sets MEETSPACE_PREVIEW=1, which drops source maps and the three
#     bundles a preview never opens — alwaysontop, documentpip, close3 — and it
#     sizes the V8 heap to this machine instead of asking for a fixed 8 GB.
#
# The bundles the served page pulls are all built, so the application that
# comes up is the whole application. README.md, "What the preview does
# differently", has the detail.
#
# The readiness check is `GET /` on the port from PORT, and a ready application
# answers it 200. The start stage says when that is true:
#
#     [meetspace] STAGE=start STATUS=ready url=http://0.0.0.0:5400
#
# That line means served, not merely listening: the server writes it only after
# asking itself for `/` on loopback and getting a 200 within 5000 ms, so it is
# the same answer a readiness check gets. It appears at most once per run and
# never alongside a failure. A start stage stopped before it ever appeared is
# reported as failed rather than as a clean shutdown, because a readiness
# timeout and a teardown are otherwise the same log.
#
# The two startup failures easiest to confuse are opposites.
# `REASON=build-output-missing` means the build left nothing to serve and no
# socket was opened; the missing paths are named with a count.
# `REASON=readiness-check-failed` means the build output is there and the port
# is open but the application did not come out over it; the status code or the
# timeout value is named. The first is the build stage failing late, the second
# is the server. README.md, "When the preview does not come up", lists all five
# reasons.

model = "server"

[build]
command = "npm run preview:build"

[serve]
command = "npm run preview:start"
port_env = "PORT"
